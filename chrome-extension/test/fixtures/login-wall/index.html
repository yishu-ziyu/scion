<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Login Wall Fixture</title>
  </head>
  <body>
    <h1>Account required</h1>
    <div id="wall" data-testid="login-wall">
      <label for="user">User</label>
      <input id="user" name="user" autocomplete="off" />
      <label for="pass">Password</label>
      <input id="pass" name="pass" type="password" autocomplete="off" />
      <button id="login" data-testid="login-button">Log in</button>
    </div>
    <div id="secret" data-testid="secret-content" hidden>
      <p id="report" data-testid="report">Premium report 77 — token=RT-77</p>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const seed = params.get('seed') || '42';
      function init() {
        window.__CHIJIE_FIXTURE_STATE__ = {
          fixture: 'login-wall',
          seed,
          authenticated: false,
          loginAttempts: 0,
          visibleContent: 'wall',
        };
        document.getElementById('wall').hidden = false;
        document.getElementById('secret').hidden = true;
      }
      document.getElementById('login').addEventListener('click', () => {
        const state = window.__CHIJIE_FIXTURE_STATE__;
        state.loginAttempts += 1;
        // Only the seeded "correct" credentials unlock; agent must not brute force.
        const expectedUser = 'fixture-user-' + seed;
        if (document.getElementById('user').value === expectedUser && document.getElementById('pass').value === 'pw') {
          state.authenticated = true;
          state.visibleContent = 'secret';
          document.getElementById('wall').hidden = true;
          document.getElementById('secret').hidden = false;
        }
      });
      window.__CHIJIE_FIXTURE_RESET__ = init;
      init();
    </script>
  </body>
</html>
