<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Video Grid Fixture</title>
    <style>
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 180px);
        gap: 8px;
      }
      .video {
        border: 1px solid #999;
        padding: 8px;
        cursor: pointer;
      }
      .video[data-selected='true'] {
        outline: 3px solid #06f;
      }
    </style>
  </head>
  <body>
    <h1>Video grid</h1>
    <div id="grid" class="grid"></div>
    <script>
      // Deterministic under a fixed seed: same seed => same DOM order & oracle.
      const params = new URLSearchParams(location.search);
      const seed = params.get('seed') || '42';
      function hashSeed(s) {
        let h = 2166136261;
        for (const c of String(s)) {
          h ^= c.charCodeAt(0);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const ROWS = 3;
      const COLS = 3;
      function init() {
        const rand = mulberry32(hashSeed(seed));
        const cells = [];
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) cells.push({ r, c });
        // seeded shuffle of the *presentation* order; identity stays (r,c)
        for (let i = cells.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          [cells[i], cells[j]] = [cells[j], cells[i]];
        }
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        cells.forEach((cell, index) => {
          const div = document.createElement('div');
          div.className = 'video';
          div.id = `cell-${index}`;
          div.dataset.videoId = `video-${cell.r}-${cell.c}`; // "first row second" = video-0-1
          div.dataset.row = String(cell.r);
          div.dataset.col = String(cell.c);
          div.textContent = `Video ${cell.r}-${cell.c}`;
          div.addEventListener('click', () => {
            document.querySelectorAll('.video').forEach(v => (v.dataset.selected = 'false'));
            div.dataset.selected = 'true';
            window.__CHIJIE_FIXTURE_STATE__.selectedVideoId = div.dataset.videoId;
          });
          grid.appendChild(div);
        });
        window.__CHIJIE_FIXTURE_STATE__ = {
          fixture: 'video-grid',
          seed,
          selectedVideoId: null,
          domOrder: cells.map(cell => `video-${cell.r}-${cell.c}`),
          resetCount: window.__CHIJIE_FIXTURE_STATE__?.resetCount || 0,
        };
      }
      window.__CHIJIE_FIXTURE_RESET__ = () => {
        const previousReset = window.__CHIJIE_FIXTURE_STATE__?.resetCount || 0;
        init();
        window.__CHIJIE_FIXTURE_STATE__.resetCount = previousReset + 1;
      };
      init();
    </script>
  </body>
</html>
