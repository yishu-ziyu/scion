name: Chijie regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: chijie-regression-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"

defaults:
  run:
    shell: bash

jobs:
  evaluator-contracts:
    name: Evaluator contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Test offline evaluator contracts
        run: node --test scripts/__tests__/*.test.mjs

      - name: Validate Phase 0 eval registry
        env:
          DRY_RUN: "1"
          TASK_SET: phase0_022
        run: pnpm eval:matrix

  unit-regression:
    name: Unit regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # Unit tests type-check imports from this gitignored module. The committed
      # example is deliberately empty, so CI never injects or reads a provider key.
      - name: Create empty provider stub
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: cp chrome-extension/src/personal/secrets.local.example.ts chrome-extension/src/personal/secrets.local.ts

      - name: Prepare workspace packages
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec turbo ready

      - name: Test critical verification paths
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          pnpm -F chrome-extension exec vitest run
          src/background/task/__tests__/completion.test.ts
          src/background/task/__tests__/manager.test.ts
          src/background/task/__tests__/mission-plan.test.ts
          src/background/task/__tests__/verification-engine.test.ts
          src/background/browser/sites/__tests__/understanding-answer.test.ts

      - name: Test all extension units
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -F chrome-extension test

      - name: Test side panel
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -F @extension/sidepanel test

  static-quality:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Create empty provider stub
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: cp chrome-extension/src/personal/secrets.local.example.ts chrome-extension/src/personal/secrets.local.ts

      - name: Prepare workspace packages
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec turbo ready

      - name: Type-check all workspaces
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm type-check

      # The repository-level lint and prettier scripts use --fix/--write. CI invokes
      # their read-only equivalents so a passing run cannot hide a dirty diff.
      - name: Lint all workspaces
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec turbo lint --continue

      - name: Check structure
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:structure

      - name: Report structure hotspots
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: pnpm report:structure

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}"; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi

          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$GITHUB_SHA" -- .
          )

          if (( ${#changed_files[@]} == 0 )); then
            echo 'No changed files require a formatting check.'
            exit 0
          fi

          files=()
          for file in "${changed_files[@]}"; do
            files+=("$GITHUB_WORKSPACE/$file")
          done

          pnpm exec prettier --check --ignore-unknown --ignore-path "$GITHUB_WORKSPACE/.prettierignore" "${files[@]}"

      - name: Bundle with an inert provider placeholder
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          MINIMAX_API_KEY: ci-bundle-placeholder-not-a-secret
        run: pnpm build
